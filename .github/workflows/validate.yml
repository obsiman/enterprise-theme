name: Validate theme

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build distribution
        run: npm run build

      - name: Validate generated theme
        run: npm run validate

      - name: Install lint dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Lint source CSS
        run: npm run lint

      - name: Verify pull requests commit generated CSS
        if: github.event_name == 'pull_request'
        run: test -z "$(git status --porcelain -- theme.css)"

      - name: Keep generated CSS synchronized on main
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git status --porcelain -- theme.css)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme.css
          git commit -m "Build theme distribution"
          git push
