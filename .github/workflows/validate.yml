name: Validate theme

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build distribution
        run: npm run build

      - name: Validate generated theme
        run: npm run validate

      - name: Lint source CSS
        run: npm run lint

      - name: Verify generated CSS is committed
        run: git diff --exit-code -- theme.css

      - name: Run test suite
        run: npm run test
